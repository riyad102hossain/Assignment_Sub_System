services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: assignment_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. .NET 10 Web API Service
  backend:
    build:
      context: ./AssignmentSubSystem.API
      dockerfile: Dockerfile
    container_name: assignment_api
    restart: always
    ports:
      - "8080:8080"
    
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Jwt:Secret=${JWT_SECRET}
      - Jwt:Issuer=${JWT_ISSUER}
      - Jwt:Audience=${JWT_AUDIENCE}
      - Jwt:ExpiryMinutes=${JWT_EXPIRY_MINUTES}

    depends_on:
      db:
        condition: service_healthy

  # 3. Next.js Frontend Service
  frontend:
    build:
      context: ./assignmentsub-client
      dockerfile: Dockerfile
    container_name: assignment_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_started

    # 4. Portainer Web UI Dashboard
  portainer:
    image: portainer/portainer-ce:latest
    container_name: docker_ui
    restart: always
    command: -H unix:///var/run/docker.sock
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data


volumes:
  pgdata:
  portainer_data:
